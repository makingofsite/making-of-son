<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap - Making Of</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0; overflow: hidden; background-color: #000;">

    <div class="login-wrapper">
        
        <div class="login-image-side" style="background-image: url('arsiv/giris.jpg');">
            <div class="login-overlay"></div>
            <a href="index.html" class="login-logo">
                <img src="logo.svg" alt="Making Of Logo">
            </a>
            <div class="login-quote">
                
            </div>
        </div>

        <div class="login-form-side">
            <div class="login-box">
                <h2>Giriş Yap</h2>
                <p class="login-subtitle"></p>
                
                <form action="index.html">
                    <div class="input-group">
                        <label>E-posta Adresi</label>
                        <input type="email" class="login-input" placeholder="ornek@mail.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label>Şifre</label>
                        <input type="password" class="login-input" placeholder="••••••••" required>
                    </div>
                    
                    <div class="login-actions">
                        <label class="remember-me">
                            <input type="checkbox"> Beni Hatırla
                        </label>
                        <a href="#" class="forgot-password">Şifremi Unuttum</a>
                    </div>
                    
                    <a href="index.html" class="login-submit-btn" style="display: block; text-align: center; text-decoration: none; box-sizing: border-box;">GİRİŞ YAP</a>
                    
                </form>
                
                <p class="signup-prompt">
                    Henüz üye olmadın mı? <a href="kaydol.html">Kaydol</a>
                </p>
            </div>
        </div>

    </div>

</body>
</html>
